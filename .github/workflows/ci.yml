name: CI

# Nothing else gates a deploy. Netlify runs `astro build` only, so without
# this workflow the typecheck and the 87 end-to-end tests run solely when a
# human remembers to. Several defects in this project's history passed a
# green-looking check and were caught only by a test that actually ran —
# see the testing notes in README.md.
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs from the lockfile exactly, so a dependency that
      # only resolves via hoisting fails here rather than on a Netlify deploy.
      - name: Install dependencies
        run: npm ci

      # Chromium only: playwright.config.ts defines a single chromium project.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs typecheck, then unit tests, then e2e in sequence. The e2e step
      # builds the site and serves dist/ — it tests shipped output, not the
      # dev server.
      - name: Typecheck, unit tests, end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
